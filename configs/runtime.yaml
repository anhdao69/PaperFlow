schema_version: 1
environment: production
timezone: America/New_York

schedule:
  enabled: true
  run_at_local: "21:00"
  run_days:
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    - sunday
  same_day_catchup: true

source:
  provider: arxiv
  mode: new_only
  categories:
    - cs.AI
    - cs.CV
    - cs.LG
    - cs.RO
    - cs.CL
  request_timeout_seconds: 30

filtering:
  batch_size: 10
  concurrency: 3
  semantic_retry_count: 1
  transient_retry_count: 3
  failed_auto_retry_max_attempts: 5
  failed_retry_cooldown_hours: 12

summaries:
  concurrency: 5
  semantic_retry_count: 1
  transient_retry_count: 3
  failed_auto_retry_max_attempts: 3

publishing:
  base_url: https://anhdao69.github.io/PaperFlow/
  readme_latest_limit: 80
  generate_daily_archive: true
  generate_feed_index: true
  generate_daily_json_feeds: true
  generate_topic_markdown: true
  generate_topic_json: true
  generate_website: true

figures:
  enabled: false
  iphone_placeholder: true

observability:
  persist_run_stats: true
  log_llm_usage: true
  log_model_used: true
  log_provider_used: true
