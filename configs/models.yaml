schema_version: 1
provider: openrouter
base_url: https://openrouter.ai/api/v1

models:
  deepseek_v4_flash:
    model_id: deepseek/deepseek-v4-flash-0731
    temperature: 0.0
    max_output_tokens: 8000

  glm_4_7_flashx:
    model_id: z-ai/glm-4.7-flash
    temperature: 0.0
    max_output_tokens: 8000

  gpt_5_6_luna:
    model_id: openai/gpt-5.6-luna
    # Current OpenRouter endpoints do not advertise temperature support.
    temperature: null
    max_output_tokens: 8000

  mistral_small_4:
    model_id: mistralai/mistral-small-2603
    temperature: 0.0
    max_output_tokens: 8000

tasks:
  filter:
    primary: deepseek_v4_flash
    fallbacks:
      - glm_4_7_flashx
      - gpt_5_6_luna
      - mistral_small_4

  summary:
    primary: gpt_5_6_luna
    fallbacks:
      - deepseek_v4_flash
      - mistral_small_4
      - glm_4_7_flashx

routing:
  allow_provider_fallbacks: true
  provider_sort: default
  require_structured_outputs: true
