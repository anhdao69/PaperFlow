schema_version: 1
taxonomy_version: 2
topics:
  - id: embodied-ai
    name: Embodied AI
    icon: figure.walk
    description: Intelligent agents that perceive, reason, and act in physical environments.
    subtopics:
      - id: vision-language-navigation
        name: Vision-Language Navigation
        short_name: VLN
        description: Navigation driven by visual observations and language instructions.
        include: [instruction following, embodied navigation, visual navigation, scenegraph navigation]
        exclude: [pure image captioning without embodied navigation]
      - id: robot-navigation
        name: Robot Navigation
        description: Learning-based methods for autonomous navigation and planning without requiring language instructions.
        include: [robot navigation, local planning, waypoint prediction, goal-conditioned navigation, visual navigation, obstacle avoidance, learned planners, navigation policies]
        exclude: [language-conditioned navigation, classical navigation without learned components]
      - id: vision-language-action
        name: Vision-Language-Action
        short_name: VLA
        description: Models connecting visual and language understanding to physical actions.
        include: [robot policy learning, multimodal action models]
        exclude: [vision-language models without action generation]
      - id: robot-learning-and-manipulation
        name: Robot Learning and Manipulation
        description: Learning-based methods for robotic control, skill acquisition, and physical interaction.
        include: [imitation learning, reinforcement learning for robotics, robot manipulation, grasping, dexterous manipulation, visuomotor control, mobile manipulation]
        exclude: [classical control without learned components, navigation-only methods]
      - id: learning-from-human-video
        name: Learning from Human Videos
        description: Learning actions, affordances, skills, and embodied knowledge from videos of humans interacting with the world including egocentric videos.
        include: [human video learning, human demonstration videos, video imitation learning, human-object interaction, learning robot skills from human video, egocentric video learning]
        exclude: [human action recognition without learning transferable embodied knowledge]

  - id: world-models
    name: World Models
    icon: globe.americas.fill
    description: Learned representations and predictors of environment dynamics.
    subtopics:
      - id: latent-action-models
        name: Latent Action Models
        description: Models that infer or operate through latent representations of actions.
        include: [latent actions, unsupervised action discovery]
        exclude: [standard latent-variable models without actions]
      - id: video-world-models
        name: Video World Models
        description: Video-based models that learn and predict environment dynamics.
        include: [video world models, future video prediction, long-horizon world prediction, predictive video models]
        exclude: [action-conditioned interactive world simulation, video editing]
      - id: interactive-world-models
        name: Interactive World Models
        description: World models that generate future environments conditioned on agent or user actions.
        include: [interactive world models, action-conditioned generation, controllable world models, action-conditioned video prediction]
        exclude: [passive world prediction, robot policies whose primary output is actions]

  - id: multimodal-foundation-models
    name: Multimodal Foundation Models
    icon: eye.fill
    description: General-purpose foundation models spanning vision, language, and other modalities.
    subtopics:
      - id: multimodal-large-language-models
        name: Multimodal Large Language Models
        short_name: MLLMs
        description: Large language models extended with visual or additional modalities.
        include: [multimodal instruction tuning, interleaved multimodal reasoning]
        exclude: [text-only large language models]
      - id: spatial-intelligence
        name: Spatial Intelligence
        description: Multimodal models that understand, represent, and reason about spatial relationships, geometry, layouts, and environments, including models that explicitly incorporate geometric features, priors, or constraints into their architectures.
        include: [spatial reasoning, spatial understanding, geometric reasoning, spatial relations, 3D-aware reasoning, embodied spatial reasoning, geometry-aware VLMs, geometric priors, depth-aware multimodal models, 3D-aware multimodal models, geometry token fusion]
        exclude: [non-spatial multimodal reasoning, classical geometry algorithms without learned multimodal models, pure 3D reconstruction, geometry-free vision-language models]

  - id: 3d-vision
    name: 3D Vision
    icon: cube.transparent
    description: Perception and generation of three-dimensional scenes and geometry.
    subtopics:
      - id: 3d-foundation-models
        name: 3D Foundation Models
        description: Broad pretrained models for 3D perception, generation, or reasoning.
        include: [large-scale 3D pretraining, generalist 3D models]
        exclude: [task-specific small 3D models without foundation pretraining]

  - id: video-models
    name: Video Generation and Understanding
    icon: film.stack.fill
    description: Models for generating, representing, and understanding temporally structured visual data.
    subtopics:
      - id: video-diffusion
        name: Video Diffusion
        description: Diffusion-based approaches to video synthesis and editing.
        include: [text-to-video diffusion, diffusion video models]
        exclude: [image-only diffusion]
      - id: autoregressive-video-models
        name: Autoregressive Video Models
        description: Video generators that predict tokens, frames, or latents autoregressively.
        include: [autoregressive video tokens, next-frame generation]
        exclude: [non-autoregressive image generation]
      - id: video-understanding
        name: Video Understanding
        description: Models that learn temporal representations and reason about actions, events, objects, and dynamics in video.
        include: [video representation learning, temporal reasoning, long-video understanding, video-language understanding, action understanding]
        exclude: [video generation without an understanding or recognition objective]

  - id: efficient-ai
    name: Efficient AI
    icon: bolt.fill
    description: Methods that reduce computation, memory, latency, or energy use in AI systems.
    subtopics:
      - id: token-pruning-and-eviction
        name: Token Pruning and Eviction
        description: Selecting, pruning, merging, or evicting tokens to improve efficiency.
        include: [token pruning, token merging, token eviction]
        exclude: [dataset pruning without token-level methods]
      - id: efficient-attention
        name: Efficient Attention
        description: Attention mechanisms with improved compute or memory complexity.
        include: [linear attention, sparse attention]
        exclude: [standard dense attention without efficiency contribution]
      - id: kv-cache-and-memory-efficiency
        name: KV Cache and Memory Efficiency
        description: Techniques that reduce inference cache or model memory requirements.
        include: [KV cache compression, memory-efficient inference]
        exclude: [storage systems unrelated to model inference]

  - id: adaptation-and-memory
    name: Adaptation and Memory
    icon: brain.head.profile
    description: Methods that enable models and embodied agents to adapt, learn, and retain useful information during deployment or continued interaction.
    subtopics:
      - id: test-time-learning
        name: Test-Time Learning
        description: Methods that update model representations, parameters, or internal states during inference using information available at deployment time.
        include: [test-time training, test-time adaptation, inference-time learning, test-time optimization, online test-time adaptation]
        exclude: [standard offline training without deployment-time adaptation]
      - id: continual-and-online-learning
        name: Continual and Online Learning
        description: Methods that continuously update models from sequential or streaming experience while preserving previously acquired knowledge.
        include: [continual learning, online learning, lifelong learning, streaming adaptation, incremental learning]
        exclude: [static offline training on a fixed dataset]
      - id: embodied-memory
        name: Embodied Memory
        description: Memory mechanisms designed for embodied agents to retain spatial, temporal, perceptual, and interaction history across environments and tasks.
        include: [navigation memory, spatiotemporal memory, episodic embodied memory, environment memory, trajectory memory, interaction memory]
        exclude: [generic language-model memory without embodied or environment-grounded information]

  - id: language-foundation-models
    name: Language Foundation Models
    icon: text.bubble.fill
    description: Large language foundation models and methods for architecture, reasoning, context, and memory.
    subtopics:
      - id: large-language-models
        name: Large Language Models
        short_name: LLMs
        description: Research on modern large language foundation models and their architectural advances.
        include: [Qwen, Kimi, Llama, DeepSeek, mixture-of-experts LLMs, LLM architectures, foundation language models]
        exclude: [small language models, multimodal models primarily focused on vision or robotics]
      - id: llm-memory
        name: LLM Memory
        description: Persistent or external memory mechanisms that allow language models to store and retrieve information beyond the current context.
        include: [long-term memory, external memory, memory retrieval, recurrent memory, agent memory]
        exclude: [standard long-context processing without persistent memory]
      - id: long-context-models
        name: Long-Context Models
        description: Methods that enable language models to process and reason over very long input contexts.
        include: [long context, context extension, million-token context, RoPE scaling, long-context training]
        exclude: [persistent external memory, agent memory]
