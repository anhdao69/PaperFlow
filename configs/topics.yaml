schema_version: 1
taxonomy_version: 1
topics:
  - id: embodied-ai
    name: Embodied AI
    description: Intelligent agents that perceive, reason, and act in physical environments.
    subtopics:
      - id: vision-language-navigation
        name: Vision-Language Navigation
        short_name: VLN
        description: Navigation driven by visual observations and language instructions.
        include: [instruction following, embodied navigation, visual navigation]
        exclude: [pure image captioning without embodied navigation]
      - id: vision-language-action
        name: Vision-Language-Action
        short_name: VLA
        description: Models connecting visual and language understanding to physical actions.
        include: [robot policy learning, multimodal action models]
        exclude: [vision-language models without action generation]
      - id: robot-learning
        name: Robot Learning
        description: Learning-based methods for robotic control, adaptation, and interaction.
        include: [imitation learning, reinforcement learning for robotics]
        exclude: [classical control without learned components]

  - id: world-models
    name: World Models
    description: Learned representations and predictors of environment dynamics.
    subtopics:
      - id: latent-action-models
        name: Latent Action Models
        description: Models that infer or operate through latent representations of actions.
        include: [latent actions, unsupervised action discovery]
        exclude: [standard latent-variable models without actions]
      - id: world-action-models
        name: World Action Models
        description: Joint models of world dynamics and agent actions.
        include: [action-conditioned prediction, interactive world models]
        exclude: [passive prediction without action conditioning]
      - id: video-world-models
        name: Video World Models
        description: Video prediction and generation systems used as models of world dynamics.
        include: [long-horizon video prediction, interactive video generation]
        exclude: [video editing without predictive world modeling]

  - id: multimodal-foundation-models
    name: Multimodal Foundation Models
    description: General-purpose foundation models spanning vision, language, and other modalities.
    subtopics:
      - id: vision-language-models
        name: Vision-Language Models
        short_name: VLMs
        description: Foundation models jointly processing visual and language information.
        include: [visual question answering, image-language pretraining]
        exclude: [single-modality language models]
      - id: multimodal-large-language-models
        name: Multimodal Large Language Models
        short_name: MLLMs
        description: Large language models extended with visual or additional modalities.
        include: [multimodal instruction tuning, interleaved multimodal reasoning]
        exclude: [text-only large language models]

  - id: spatial-intelligence
    name: Spatial Intelligence
    description: Methods for spatial reasoning, representation, memory, and geometry.
    subtopics:
      - id: spatial-reasoning
        name: Spatial Reasoning
        description: Reasoning about spatial relationships, transformations, and layouts.
        include: [spatial relations, geometric reasoning]
        exclude: [non-spatial symbolic reasoning]
      - id: spatial-memory
        name: Spatial Memory
        description: Persistent representations that support reasoning across places and time.
        include: [spatial maps, persistent scene memory]
        exclude: [generic sequence memory without spatial structure]
      - id: geometry-aware-models
        name: Geometry-Aware Models
        description: Models that explicitly incorporate geometric structure or constraints.
        include: [geometric priors, equivariant spatial models]
        exclude: [geometry-free image classification]

  - id: 3d-vision
    name: 3D Vision
    description: Perception and generation of three-dimensional scenes and geometry.
    subtopics:
      - id: depth-estimation
        name: Depth Estimation
        description: Inferring metric or relative depth from visual observations.
        include: [monocular depth, stereo depth]
        exclude: [2D segmentation without depth]
      - id: 3d-reconstruction
        name: 3D Reconstruction
        description: Recovering 3D shape, scene structure, or appearance from observations.
        include: [neural reconstruction, structure from motion]
        exclude: [2D image restoration]
      - id: 3d-foundation-models
        name: 3D Foundation Models
        description: Broad pretrained models for 3D perception, generation, or reasoning.
        include: [large-scale 3D pretraining, generalist 3D models]
        exclude: [task-specific small 3D models without foundation pretraining]

  - id: video-generation
    name: Video Generation
    description: Generative and predictive models that synthesize video over time.
    subtopics:
      - id: video-diffusion
        name: Video Diffusion
        description: Diffusion-based approaches to video synthesis and editing.
        include: [text-to-video diffusion, diffusion video models]
        exclude: [image-only diffusion]
      - id: autoregressive-video-models
        name: Autoregressive Video Models
        description: Video generators that predict tokens, frames, or latents autoregressively.
        include: [autoregressive video tokens, next-frame generation]
        exclude: [non-autoregressive image generation]
      - id: video-prediction
        name: Video Prediction
        description: Forecasting future frames, events, or dynamics from observed video.
        include: [future frame prediction, long-horizon forecasting]
        exclude: [retrospective video recognition]

  - id: efficient-ai
    name: Efficient AI
    description: Methods that reduce computation, memory, latency, or energy use in AI systems.
    subtopics:
      - id: token-pruning-and-eviction
        name: Token Pruning and Eviction
        description: Selecting, pruning, merging, or evicting tokens to improve efficiency.
        include: [token pruning, token merging, token eviction]
        exclude: [dataset pruning without token-level methods]
      - id: efficient-attention
        name: Efficient Attention
        description: Attention mechanisms with improved compute or memory complexity.
        include: [linear attention, sparse attention]
        exclude: [standard dense attention without efficiency contribution]
      - id: kv-cache-and-memory-efficiency
        name: KV Cache and Memory Efficiency
        description: Techniques that reduce inference cache or model memory requirements.
        include: [KV cache compression, memory-efficient inference]
        exclude: [storage systems unrelated to model inference]
