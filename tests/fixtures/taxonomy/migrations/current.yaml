schema_version: 1
taxonomy_version: 2
topics:
  - id: topic-new
    name: Topic New
    description: Renamed original parent topic.
    previous_ids: [old-topic]
  - id: destination
    name: Destination
    description: Destination topic.
    subtopics:
      - id: existing-child
        name: Existing Child
        description: Existing destination child.
      - id: child-new
        name: Child New
        description: Renamed and moved child.
        previous_ids: [old-child]
        moved_from:
          topic_id: old-topic
