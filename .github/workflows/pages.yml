name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "data/feed_index.json"
      - "data/topics.json"
      - "data/daily_feeds/**"
      - "data/topic_feeds/**"
      - "figures/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - PaperFlow Daily
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Stage public site and feed allowlist
        run: |
          mkdir -p _pages/data
          cp -R site/. _pages/
          cp data/feed_index.json data/topics.json _pages/data/
          if [ -d data/daily_feeds ]; then cp -R data/daily_feeds _pages/data/; fi
          if [ -d data/topic_feeds ]; then cp -R data/topic_feeds _pages/data/; fi
          if [ -d figures ]; then cp -R figures _pages/; fi
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
