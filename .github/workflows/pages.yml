name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "data/feed_index.json"
      - "data/topics.json"
      - "data/daily_feeds/**"
      - "data/topic_feeds/**"
      - "figures/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - PaperFlow Daily
      - Recover October 6-8
      - Recover November 12-13
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Report initial disk space
        run: df -h
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Fetch only public deployment inputs, without canonical state/history.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /figures/
            /data/feed_index.json
            /data/topics.json
            /data/daily_feeds/
            /data/topic_feeds/
      - uses: actions/configure-pages@v5
      - name: Stage public site and feed allowlist
        run: |
          # Rename on the same filesystem instead of duplicating every public byte.
          mv site _pages
          mkdir -p _pages/data
          mv data/feed_index.json data/topics.json _pages/data/
          if [ -d data/daily_feeds ]; then mv data/daily_feeds _pages/data/; fi
          if [ -d data/topic_feeds ]; then mv data/topic_feeds _pages/data/; fi
          if [ -d figures ]; then mv figures _pages/; fi
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report final disk space
        if: always()
        run: df -h
