name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: python -c "import paperflow"
      - run: python -m paperflow.cli.validate_config
      - run: python -m paperflow.cli.validate_taxonomy
      - run: python -m paperflow.cli.sync_schedule --check
      - run: python -m paperflow.render.validation
      - run: python -m paperflow.cli.rebuild_outputs --dry-run
