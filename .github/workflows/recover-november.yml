name: Cleanup oldest month after November recovery

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Remove the reviewed August 21–September 20 archive
        type: boolean
        default: false
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  # Queue behind the entire currently running two-day recovery.
  group: paperflow-november-recovery
  cancel-in-progress: false

jobs:
  prune:
    concurrency:
      group: paperflow-daily
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - run: df -h
      - name: Check out reviewed maintenance code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: maintenance
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: src
      - name: Check out latest published archive
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main
          path: publication
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
        working-directory: publication
      - name: Require completed November recovery
        working-directory: publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("data/state.json").read_text())
          assert state["last_successful_local_date"] >= "2026-11-13", "Finish November 12-13 recovery first"
          PY
      - name: Validate original repository
        working-directory: publication
        run: python -m paperflow.render.validation
      - name: Preview reviewed cleanup
        working-directory: publication
        run: >-
          python ../maintenance/src/paperflow/cli/prune_archive.py
          --before 2026-09-21 --expected-papers 3931
      - name: Remove oldest month and rebuild outputs
        working-directory: publication
        if: inputs.apply
        run: >-
          python ../maintenance/src/paperflow/cli/prune_archive.py
          --before 2026-09-21 --expected-papers 3931 --apply
      - name: Validate retained archive and protected state
        working-directory: publication
        if: inputs.apply
        run: |
          python -m paperflow.render.validation
          git diff --exit-code -- data/state.json data/screening_events recovery configs
      - name: Commit validated cleanup
        working-directory: publication
        if: inputs.apply
        run: |
          git config user.name "paperflow-bot"
          git config user.email "paperflow-bot@users.noreply.github.com"
          python -m paperflow.cli.commit_generated \
            --message "chore: prune August 21–September 20 archive"
          git push
      - name: Deploy cleaned archive
        if: inputs.apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          request = urllib.request.Request(
              "https://api.github.com/repos/anhdao69/PaperFlow/actions/workflows/pages.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode(),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204
          print("Pages deployment dispatched for the cleaned main branch.")
          PY
      - run: df -h
        if: always()
