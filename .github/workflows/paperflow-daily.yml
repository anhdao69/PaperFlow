name: PaperFlow Daily

on:
  # BEGIN AUTO-GENERATED PAPERFLOW SCHEDULE
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
    - cron: "17 3 * * *"
    - cron: "17 4 * * *"
    - cron: "17 5 * * *"
  # END AUTO-GENERATED PAPERFLOW SCHEDULE
  workflow_dispatch:
    inputs:
      catch_up:
        description: Run the oldest missed scheduled publication date
        required: false
        default: false
        type: boolean
      recovery_date:
        description: Replay a verified historical input snapshot
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "2026-10-06"
          - "2026-10-07"
          - "2026-10-08"
  workflow_call:
    inputs:
      catch_up:
        type: boolean
        default: true
      recovery_date:
        type: string
        required: true
    secrets:
      OPENROUTER_API_KEY:
        required: true

concurrency:
  group: paperflow-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A queued cron run may carry a SHA from before the preceding run
          # published. Read the latest state so the due gate can exit cleanly.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Reserve missing dates for verified recovery
        env:
          RECOVERY_DATE: ${{ inputs.recovery_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("data/state.json").read_text())
          previous = state.get("last_successful_local_date")
          if previous in {"2026-10-05", "2026-10-06", "2026-10-07"} and not os.environ.get("RECOVERY_DATE"):
              raise SystemExit("October recovery is pending; use Recover October 6-8 or an explicit recovery_date.")
          PY
      - name: Check publication schedule
        id: schedule
        env:
          RECOVERY_DATE: ${{ inputs.recovery_date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.catch_up }}" != "true" ] && [ -z "$RECOVERY_DATE" ]; then
            python -m paperflow.schedule \
              --manual \
              --github-output "$GITHUB_OUTPUT"
          else
            python -m paperflow.schedule \
              --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.schedule.outputs.due == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build pinned PDFFigures2
        if: steps.schedule.outputs.due == 'true'
        run: |
          git clone --filter=blob:none https://github.com/allenai/pdffigures2.git /tmp/pdffigures2
          git -C /tmp/pdffigures2 checkout 3d7ad46753d4a315cccd1c2bcab398380e88c534
          curl --fail --location --retry 3 \
            --output /tmp/sbt.tgz \
            https://github.com/sbt/sbt/releases/download/v1.7.1/sbt-1.7.1.tgz
          tar -xzf /tmp/sbt.tgz -C /tmp
          cd /tmp/pdffigures2
          /tmp/sbt/bin/sbt -Dsbt.log.noformat=true -batch -no-colors assembly
          echo "PAPERFLOW_PDFFIGURES2_JAR=/tmp/pdffigures2/pdffigures2.jar" >> "$GITHUB_ENV"
      - name: Run PaperFlow
        if: steps.schedule.outputs.due == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RECOVERY_DATE: ${{ inputs.recovery_date }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$RECOVERY_DATE" ]; then
            case "$RECOVERY_DATE" in
              2026-10-06|2026-10-07|2026-10-08) ;;
              *) echo "Unsupported recovery date"; exit 1 ;;
            esac
            python -m paperflow.main \
              --source-snapshot "recovery/2026-10-09/$RECOVERY_DATE.json"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.catch_up }}" != "true" ]; then
            python -m paperflow.main --manual
          else
            python -m paperflow.main
          fi
      - name: Validate generated outputs
        if: steps.schedule.outputs.due == 'true'
        run: python -m paperflow.render.validation
      - name: Preserve source inputs for recovery
        if: always() && steps.schedule.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paperflow-source-${{ steps.schedule.outputs.local_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/paperflow/raw/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit generated content
        if: steps.schedule.outputs.due == 'true'
        run: |
          python -c 'from pathlib import Path; p = Path("data/papers.json"); assert p.stat().st_size < 100 * 1024 * 1024, "Canonical paper store exceeds GitHub file limit"'
          git config user.name "paperflow-bot"
          git config user.email "paperflow-bot@users.noreply.github.com"
          python -m paperflow.cli.commit_generated \
            --message "chore: update PaperFlow generated content"
          git push
