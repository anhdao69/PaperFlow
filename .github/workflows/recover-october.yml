name: Recover October 6-8

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paperflow-october-recovery
  cancel-in-progress: false

jobs:
  october_6:
    uses: ./.github/workflows/paperflow-daily.yml
    with:
      catch_up: true
      recovery_date: "2026-10-06"
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  october_7:
    needs: october_6
    uses: ./.github/workflows/paperflow-daily.yml
    with:
      catch_up: true
      recovery_date: "2026-10-07"
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  october_8:
    needs: october_7
    uses: ./.github/workflows/paperflow-daily.yml
    with:
      catch_up: true
      recovery_date: "2026-10-08"
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
